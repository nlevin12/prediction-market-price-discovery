[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-price-discovery"
version = "0.1.0"
description = "Analysis utilities for prediction-market and equity price discovery research"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
